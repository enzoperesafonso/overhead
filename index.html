<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Overhead — print the sky from any moment</title>
  <meta name="description" content="Design a print-ready star map of any moment and place, then download it as a vector PDF. Free, private, runs entirely in your browser.">
  <meta name="theme-color" content="#ffffff">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%23191a1c'/%3E%3Cpath d='M16 6l2.2 6.6L25 13l-5.4 4 2 6.6L16 20l-5.6 3.6 2-6.6L7 13l6.8-.4z' fill='%23fff'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="bar">
    <div class="brand"><svg width="18" height="18" viewBox="0 0 32 32" aria-hidden="true"><path d="M16 3l3.2 9.2L29 13l-7.6 6 2.8 9.4L16 22.6 7.8 28.4l2.8-9.4L3 13l9.8-.8z" fill="currentColor"/></svg><span>Overhead</span><span class="tag">Print the sky from any moment</span></div>
    <div class="actions">
      <button id="btn-about" class="ghost" type="button">About</button>
      <button id="btn-share" class="ghost" type="button" title="Copy a link that reopens this exact design">Copy link</button>
      <button id="btn-pdf" class="primary" type="button">Download PDF</button>
    </div>
  </header>

  <main>
    <aside id="panel" aria-label="Settings"><noscript>This app needs JavaScript.</noscript></aside>
    <section id="stage" aria-label="Preview">
      <div id="sheet"><canvas id="preview" aria-label="Star map preview"></canvas></div>
      <div id="zoom" role="group" aria-label="Zoom">
        <button id="zoom-out" type="button" aria-label="Zoom out">−</button>
        <button id="zoom-fit" type="button" title="Fit to window"><span id="zoom-level">100%</span></button>
        <button id="zoom-in" type="button" aria-label="Zoom in">+</button>
      </div>
      <div id="status" role="status"></div>
      <div id="busy" hidden>Working…</div>
    </section>
  </main>
  <dialog id="about" aria-labelledby="about-title">
    <h2 id="about-title">About Overhead</h2>
    <div class="about-body"></div>
    <div class="about-foot"><button class="primary" type="button" data-close>Got it</button></div>
  </dialog>
  <div id="toast" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
